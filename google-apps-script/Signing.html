<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      margin: 0; background: #f4f4f4; color: #444;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 20px 20px 60px; }
    iframe { width: 100%; height: 70vh; border: 1px solid #e2e2e2; border-radius: 10px; background: #fff; }
    .sign-box {
      background: #fff; border: 1px solid #e2e2e2; border-radius: 10px;
      margin-top: 20px; padding: 22px 26px;
    }
    .sign-box h2 { font-size: 1.05rem; margin: 0 0 6px; color: #0a0a0a; }
    .sign-box p.disclaimer { font-size: .82rem; color: #888; margin: 0 0 16px; line-height: 1.5; }
    canvas {
      border: 1px solid #cfcfcf; border-radius: 6px; touch-action: none;
      width: 100%; max-width: 480px; height: 160px; background: #fff; display: block;
    }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
    input[type="text"] {
      font-family: inherit; font-size: .9rem; padding: 9px 12px;
      border: 1px solid #cfcfcf; border-radius: 6px; flex: 1; min-width: 220px;
    }
    button {
      font-family: inherit; font-size: .85rem; font-weight: 700;
      letter-spacing: .03em; text-transform: uppercase;
      padding: 11px 20px; border-radius: 6px; border: none; cursor: pointer;
    }
    #approve { background: #cc1111; color: #fff; }
    #approve:disabled { background: #cfcfcf; cursor: not-allowed; }
    #clearBtn { background: none; border: 1px solid #cfcfcf; color: #444; }
    #msg { margin-top: 12px; font-size: .85rem; font-weight: 600; color: #cc1111; }
  </style>
</head>
<body>
<div class="wrap">
  <iframe srcdoc="<?= quoteHtml ?>"></iframe>

  <div class="sign-box">
    <h2>Approve Quote <?= number ?></h2>
    <p class="disclaimer">
      By typing your name and drawing your signature below, you confirm you have reviewed this
      quote and approve it as presented. This is a simple electronic acknowledgment for our
      internal records, not a notarized or legally certified signature.
    </p>

    <div class="row">
      <input type="text" id="signerName" placeholder="Your full name" />
    </div>
    <canvas id="pad" width="480" height="160"></canvas>
    <div class="row">
      <button id="clearBtn" type="button">Clear</button>
      <button id="approve" type="button">I Approve This Quote</button>
    </div>
    <div id="msg"></div>
  </div>
</div>

<script>
  var token = <?!= JSON.stringify(token) ?>;
  var webAppUrl = <?!= JSON.stringify(webAppUrl) ?>;
  var canvas = document.getElementById('pad');
  var ctx = canvas.getContext('2d');
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#0a0a0a';
  var drawing = false, hasSignature = false, last = null;

  // A transparent PNG background can render as solid black once Google's
  // PDF conversion flattens it -- paint an explicit white background so the
  // exported signature always has a clean, opaque backdrop.
  function fillWhite() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  fillWhite();

  function pos(e) {
    var r = canvas.getBoundingClientRect();
    var p = e.touches ? e.touches[0] : e;
    return {
      x: (p.clientX - r.left) * (canvas.width / r.width),
      y: (p.clientY - r.top) * (canvas.height / r.height)
    };
  }
  function start(e) { drawing = true; hasSignature = true; last = pos(e); e.preventDefault(); }
  function move(e) {
    if (!drawing) return;
    var p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p; e.preventDefault();
  }
  function end() { drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);

  document.getElementById('clearBtn').addEventListener('click', function () {
    fillWhite();
    hasSignature = false;
  });

  document.getElementById('approve').addEventListener('click', function () {
    var msg = document.getElementById('msg');
    var name = document.getElementById('signerName').value.trim();
    if (!name) { msg.textContent = 'Enter your name first.'; return; }
    if (!hasSignature) { msg.textContent = 'Draw your signature first.'; return; }

    var btn = document.getElementById('approve');
    btn.disabled = true;
    msg.style.color = '#444';
    msg.textContent = 'Submitting…';

    function showThankYou() {
      document.querySelector('.sign-box').innerHTML =
        '<h2>Thank you</h2><p>Your approval has been recorded and sent to our team.</p>';
    }
    function showError(text) {
      msg.style.color = '#cc1111';
      msg.textContent = text;
      btn.disabled = false;
    }

    fetch(webAppUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'sign',
        token: token,
        signerName: name,
        signaturePng: canvas.toDataURL('image/png')
      })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.ok) showThankYou();
        else showError((data && data.error) || 'Something went wrong. Please try again.');
      })
      .catch(function () {
        // The submit above may have actually gone through server-side even
        // though fetching ITS response failed (a known Apps Script redirect
        // quirk) -- check status directly before telling the client it failed.
        fetch(webAppUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'status', token: token })
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data && data.ok && data.status === 'signed') showThankYou();
            else showError('Could not submit. Check your connection and try again.');
          })
          .catch(function () {
            showError('Could not submit. Check your connection and try again.');
          });
      });
  });
</script>
</body>
</html>
